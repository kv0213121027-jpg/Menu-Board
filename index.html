<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>브릿지 커피 메뉴판</title>

  <!-- ╔══════════════════════════════════════════════════════════════════╗
       ║  ★★★  메뉴 정보  ★★★   메뉴·가격을 고칠 때는 "이 칸만" 보세요!   ║
       ╚══════════════════════════════════════════════════════════════════╝

       이 파일에서 메뉴 이름, 가격, 설명은 전부 아래 한 곳에 모여 있습니다.
       여기를 고치면 손님이 보는 화면(시그니처 메뉴, 카테고리 버튼, 메뉴 목록)이
       전부 저절로 바뀝니다. 다른 곳은 고칠 필요가 없어요.

       ■ 고치기 전에 꼭 지켜주세요 (실수 방지)
         1) 글자는 반드시 큰따옴표 "  "  안에 쓰세요.   예) "아메리카노"
         2) 가격은 따옴표 없이 숫자만 쓰세요.            예) 4500
            (원, 쉼표, 점은 쓰지 마세요. 화면에는 "4,500원"으로 자동으로 나옵니다.)
         3) 메뉴 한 줄 맨 끝의 쉼표(,)는 아주 중요해요!
            - 줄 맨 끝에 쉼표가 있는 줄 = 그 아래에 다른 메뉴가 더 있다는 뜻
            - 카테고리 안의 "맨 마지막 메뉴" 줄만 쉼표가 없습니다.
         4) 설명 글 안에 큰따옴표(")는 쓰지 마세요. 화면이 깨질 수 있어요.
         5) 고치기 전에 이 파일을 복사해서 백업해 두면 마음이 편해요.
            (망가져도 복사본으로 되돌리면 됩니다.)
         6) 고친 뒤에는 브라우저에서 새로고침(F5)을 눌러 확인하세요.
            화면이 하얗게 비면 쉼표나 따옴표가 하나 빠진 거예요. 방금 고친 줄을 다시 보세요.

       ■ 메뉴 한 줄은 이렇게 생겼어요
         { 이름: "아메리카노", 가격: 4500, 설명: "산미가 적은 고소한 원두", 시그니처: false, 품절: 0 },
            └ 메뉴 이름       └ 가격(숫자)   └ 한 줄 설명                  └ 시그니처(추천) 표시  └ 품절 표시(0/1)

       ■ 자주 하는 작업 방법
         ▶ 가격 고치기
            고칠 메뉴 줄에서 "가격:" 뒤의 숫자만 바꾸세요.
            예) 4500 → 4800  으로 바꾸면 "4,800원"으로 나옵니다.

         ▶ 메뉴 이름이나 설명 고치기
            큰따옴표 안의 글자만 바꾸세요. 따옴표 자체는 지우지 마세요.

         ▶ 메뉴 새로 추가하기
            1. 같은 카테고리 안에서 아무 메뉴 한 줄을 통째로 복사하세요.
            2. 원하는 위치에 붙여넣으세요. (붙여넣은 줄 끝에 쉼표가 있는지 확인!)
            3. 이름 / 가격 / 설명을 새 메뉴에 맞게 바꾸세요.
            4. ⚠ 맨 마지막 줄 뒤에 붙였다면:
               원래 마지막 줄 끝에 쉼표(,)를 붙이고, 새로 붙인 줄 끝의 쉼표는 지우세요.

         ▶ 메뉴 지우기
            지울 메뉴 줄 하나를 통째로 지우세요.
            ⚠ 그 줄이 카테고리의 "맨 마지막 줄"이었다면,
              새로 마지막이 된 줄 끝의 쉼표(,)를 지워야 합니다.
            (지우기 아까우면 줄 맨 앞에 // 를 붙여 "잠깐 숨기기"도 됩니다.
             다시 보이게 하려면 // 를 지우세요.)

         ▶ 시그니처 메뉴(사장님 추천) 바꾸기
            시그니처로 보여주고 싶은 메뉴는 줄 끝부분을 시그니처: true 로,
            아닌 메뉴는 시그니처: false 로 바꾸세요.
            true 로 한 메뉴는 두 군데에 나옵니다.
              ① 화면 맨 위 "★ 시그니처 메뉴" 칸
              ② 아래 메뉴 목록의 그 카드 (이름 옆에 "사장님 추천" 배지 + 살짝 더 강조)
            (2개 정도가 보기 좋아요. 영어 true / false 는 따옴표 없이 쓰세요.)
            배지에 적히는 글자("사장님 추천")를 바꾸려면 아래쪽 "배지글자" 줄의 큰따옴표 안 글자만 고치세요.

         ▶ 오늘 품절 켜고 끄기 (한 글자만 바꾸면 돼요!)
            메뉴 줄 끝에 품절: 0 이 있어요.
              · 품절: 0  →  판매 중 (평소 모습)
              · 품절: 1  →  "오늘 품절" (카드가 흐려지고 "오늘 품절" 표시가 떠요)
            ① Ctrl + F 로 품절 처리할 메뉴 이름을 검색합니다. 예) 스콘
            ② 그 줄 끝의  품절: 0  에서 0 을 1 로 바꿉니다.
            ③ Ctrl + S 로 저장하고, 브라우저에서 F5 로 새로고침합니다.
            다시 팔 수 있게 되면 1 을 0 으로 되돌리면 끝이에요.
            ⚠ 숫자 0 과 1 만 쓰세요. 따옴표는 붙이지 않아요.
            "오늘 품절" 표시의 글자를 바꾸려면 아래쪽 "품절글자" 줄의 큰따옴표 안 글자만 고치세요.

         ▶ 카테고리(커피 / 논커피 / 디저트) 이름 바꾸기
            "카테고리:" 뒤의 큰따옴표 안 글자를 바꾸세요.
            카테고리 버튼과 제목이 같이 바뀝니다.

         ▶ 카테고리 새로 만들기 (예: "샌드위치" 추가)
            1. 아래 "디저트" 덩어리 { 카테고리: ... } 전체를 복사하세요.
               ({ 로 시작해서 } 로 끝나는 부분입니다.)
            2. 맨 마지막 덩어리 바로 뒤에 붙여넣으세요.
            3. 원래 마지막 덩어리 끝 } 뒤에 쉼표(,)를 붙이세요.
            4. 새 덩어리의 카테고리 이름과 메뉴들을 바꾸세요.
            버튼도 자동으로 하나 더 생깁니다. (3~4개까지가 휴대폰에서 보기 좋아요.)

       ■ 가게 이름, 영업시간, 전화번호는 어디서 고치나요?
         이 칸이 아니라 파일 아래쪽 화면 코드 안에 있어요.
         찾는 방법: 키보드에서 Ctrl + F 를 누르고 "브릿지 커피", "08:00", "tel:" 처럼
         바꾸고 싶은 글자를 검색하세요. 그 근처에 한국어 안내 글이 달려 있어요.
         (전화번호는 "tel:" 뒤의 숫자와 버튼 글자, 두 군데를 같이 바꿔야 해요.)
       ══════════════════════════════════════════════════════════════════ -->
  <script>
    /* ----- 표시 글자 설정 (큰따옴표 안의 글자만 바꾸세요) ----- */
    const 배지글자 = "사장님 추천";   // 시그니처: true 인 메뉴에 붙는 배지 글자
    const 품절글자 = "오늘 품절";     // 품절: 1 인 메뉴에 뜨는 글자

    const 메뉴 = [

      /* ────────── 카테고리 1: 커피 ────────── */
      {
        카테고리: "커피",   // ← 버튼과 제목에 보이는 이름
        목록: [             // ← 이 [ ] 안에 커피 메뉴들이 들어 있어요
          { 이름: "아메리카노",          가격: 4500, 설명: "산미가 적은 고소한 원두",              시그니처: false, 품절: 0 },
          { 이름: "카페라떼",            가격: 5000, 설명: "부드러운 우유 거품",                    시그니처: false, 품절: 0 },
          { 이름: "바닐라 라떼",         가격: 5500, 설명: "바닐라빈을 직접 우려낸 시럽",           시그니처: false, 품절: 0 },
          { 이름: "아인슈페너",          가격: 5800, 설명: "단맛을 줄인 수제 크림",                 시그니처: true, 품절: 1 },  // 시그니처 메뉴(사장님 추천)
          { 이름: "콜드브루",            가격: 5300, 설명: "12시간 저온 추출, 목넘김이 깔끔함",     시그니처: false, 품절: 0 },
          { 이름: "디카페인 아메리카노", 가격: 5000, 설명: "카페인 걱정 없이 편하게",               시그니처: false, 품절: 0 }   // ← 카테고리 맨 마지막 줄은 쉼표 없음
        ]
      },   // ← 카테고리 덩어리 사이에는 쉼표가 필요해요

      /* ────────── 카테고리 2: 논커피 ────────── */
      {
        카테고리: "논커피",
        목록: [
          { 이름: "흑임자 라떼", 가격: 5500, 설명: "국산 흑임자를 직접 갈아 넣음",   시그니처: true, 품절: 0 },  // 시그니처 메뉴(사장님 추천)
          { 이름: "말차 라떼",   가격: 5800, 설명: "우지 말차, 쌉싸름한 맛이 진함",  시그니처: false, 품절: 0 },
        ]
      },

      /* ────────── 카테고리 3: 디저트 ────────── */
      {
        카테고리: "디저트",
        목록: [
          { 이름: "치즈케이크",        가격: 6500, 설명: "굽지 않은 부드러운 식감",         시그니처: false, 품절: 0 },
          { 이름: "당근케이크",        가격: 6000, 설명: "견과류를 넉넉히 넣음",             시그니처: false, 품절: 0 },
          { 이름: "스콘",              가격: 4000, 설명: "겉은 바삭 속은 촉촉, 잼과 함께",   시그니처: false, 품절: 0 },
          { 이름: "바스크 치즈케이크", 가격: 6800, 설명: "겉면을 진하게 태운 풍미",          시그니처: false, 품절: 0 }   // ← 마지막 줄: 쉼표 없음
        ]
      }   // ← 맨 마지막 카테고리 덩어리 뒤에는 쉼표가 없어요

      /* 카테고리를 새로 만들 때는 위 "}" 뒤에 쉼표(,)를 붙이고 이 자리에 새 덩어리를 붙여넣으세요 */
    ];
  </script>

  <!-- 고운 돋움 글꼴을 인터넷에서 불러옵니다. 못 불러오면 맑은 고딕이 대신 쓰입니다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

  <style>
    /* ===== 색깔 설정 (색을 바꾸고 싶으면 여기 # 숫자만 바꾸세요. 전체 색이 한 번에 바뀝니다) =====
       예전 갈색 버전으로 되돌리고 싶으면 저에게 "갈색으로 되돌려줘"라고 말씀하세요. */
    :root {
      --sky:        #CFE8F7;   /* 하늘색 파스텔: 배경 그라데이션 시작 */
      --sky-mid:    #E3F1F8;   /* 하늘색과 크림색 사이 */
      --cream:      #F5EFE6;   /* 크림색: 카드·배경 끝 */
      --sky-strong: #3F86B8;   /* 포인트 하늘색: 가격, 선택된 버튼, 배지 */
      --ink:        #2F4A5E;   /* 기본 글자색 (진한 남청색) */
      --ink-soft:   #52697A;   /* 설명 글자색 (조금 연한 색) */

      /* 예전 갈색 버전 값 (보관용): --brown #4A3728, --brown-soft #6b5240, --accent #c9a37a */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
      /* 아이폰을 가로로 돌렸을 때 글자가 멋대로 커지며 깨지는 것을 막아요 */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: 'Gowun Dodum', 'Malgun Gothic', '맑은 고딕', sans-serif;
      color: var(--ink);
      background-color: var(--sky);
      /* 은은한 그라데이션: 위는 하늘색, 아래로 갈수록 크림색 + 흐릿한 빛 얼룩 */
      background-image:
        radial-gradient(circle at 12% 6%,  rgba(255,255,255,0.75), transparent 40%),
        radial-gradient(circle at 92% 30%, rgba(143,196,230,0.45), transparent 42%),
        radial-gradient(circle at 10% 78%, rgba(245,239,230,0.95), transparent 45%),
        linear-gradient(170deg, var(--sky) 0%, var(--sky-mid) 45%, var(--cream) 100%);
      background-attachment: fixed;
      min-height: 100vh;
      line-height: 1.55;
      /* 한국어 글자가 단어 중간에서 끊겨 줄바꿈되지 않게 하고, 너무 긴 글은 안전하게 줄바꿈해요 */
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    /* 휴대폰 폭(390px)에 맞춘 가운데 영역. padding이 바깥 여백입니다. */
    .page {
      max-width: 390px;
      margin: 0 auto;
      padding: 36px 20px 96px;   /* 아래 여백이 큰 이유: '맨 위로' 버튼이 마지막 내용을 가리지 않게 */
    }

    /* ===== 유리 카드 공통 =====
       - 0.55 = 투명도 (작을수록 더 투명, 커질수록 더 진함)
       - blur = 뒤 배경을 얼마나 흐리게 할지
       - border-radius = 모서리 둥근 정도, box-shadow = 그림자 */
    .glass {
      background: rgba(245, 239, 230, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(63, 134, 184, 0.14);
    }

    /* ===== 1. 맨 위: 가게 이름 ===== */
    header {
      text-align: center;
      color: var(--ink);
      padding: 18px 0 30px;
    }
    header .location {
      font-size: 14px;
      letter-spacing: 1px;
      color: var(--ink-soft);
    }
    header h1 {
      font-size: 36px;
      font-weight: normal;
      margin: 8px 0 10px;
      letter-spacing: 2px;
    }
    header .intro {
      font-size: 16px;
      color: var(--ink-soft);
    }

    /* ===== 시그니처 메뉴 (화면 맨 위 칸) ===== */
    .section-title {
      color: var(--ink);
      font-size: 16px;
      margin: 8px 6px 12px;
    }
    .signature-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 30px;
    }
    .signature {
      padding: 18px 16px 20px;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      color: #fff;
      background: var(--sky-strong);
      border-radius: 999px;
      padding: 3px 12px;
      margin-bottom: 10px;
    }
    .signature .name { font-size: 18px; }
    .signature .price { font-size: 18px; font-weight: bold; color: var(--sky-strong); margin-top: 4px; }

    /* ===== 시그니처(사장님 추천) 카드 강조 =====
       - 테두리와 그림자를 하늘색으로 조금 진하게, 배경은 조금 더 밝게 합니다.
       - 더 눈에 띄게 하고 싶으면 아래 숫자(0.85, 0.28 등)를 키우세요. */
    .menu-item.is-signature, .signature {
      background: rgba(255, 252, 247, 0.85);
      border: 1.5px solid rgba(63, 134, 184, 0.55);
      box-shadow: 0 12px 30px rgba(63, 134, 184, 0.28);
    }
    /* 작은 배지(사장님 추천) 모양: 메뉴 이름 바로 옆에 붙어요 */
    .tag {
      display: inline-block;
      vertical-align: middle;
      margin-left: 8px;
      font-size: 13px;
      line-height: 1;
      padding: 6px 10px;
      border-radius: 999px;
      color: #fff;
      background: var(--sky-strong);
    }
    /* '오늘 품절' 표시 모양 */
    .tag.soldout-tag { background: #6B7C88; }

    /* ===== 품절 메뉴: 카드를 흐리게 (opacity 숫자가 작을수록 더 흐려져요) ===== */
    .menu-item.is-soldout, .signature.is-soldout {
      opacity: 0.55;
      filter: grayscale(0.7);
    }
    .menu-item.is-soldout .menu-price, .signature.is-soldout .price {
      text-decoration: line-through;   /* 가격에 줄을 그어줘요 */
    }

    /* ===== 카테고리 버튼 ===== */
    .tabs {
      position: sticky;
      top: 12px;
      z-index: 10;
      display: flex;
      gap: 8px;
      padding: 8px;
      margin-bottom: 26px;
    }
    /* (예전 방식의 링크형 버튼 모양. 지금은 쓰지 않지만 보관해 둡니다) */
    .tabs a {
      flex: 1;
      text-align: center;
      text-decoration: none;
      color: var(--ink);
      font-size: 15px;
      padding: 9px 0;
      border-radius: 14px;
    }
    .tabs a.active {
      background: var(--sky-strong);
      color: #fff;
    }

    /* 카테고리 버튼 (전체 / 커피 / 논커피 / 디저트)
       - min-height: 버튼 높이입니다. 52px이면 손가락으로 누르기 아주 편해요. 더 크게 하려면 숫자를 키우세요.
       - 선택 안 된 버튼: 반투명 크림색 / 선택된 버튼(.active): 하늘색 바탕 + 흰 글자 */
    .tabs button {
      flex: 1;
      min-height: 52px;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 17px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.45);
      border-radius: 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .tabs button.active {
      background: var(--sky-strong);
      color: #fff;
      box-shadow: 0 6px 14px rgba(63, 134, 184, 0.35);
    }
    .tabs button:active { transform: scale(0.97); }
    .hidden { display: none; }  /* 선택하지 않은 카테고리를 숨길 때 쓰는 표시 */

    /* ===== 2. 가운데: 메뉴 목록 ===== */
    .category { margin-bottom: 30px; scroll-margin-top: 90px; }
    .category h2 {
      color: var(--ink);
      font-size: 22px;
      font-weight: normal;
      margin: 0 6px 14px;
    }
    /* 메뉴 카드 하나. padding = 카드 안쪽 여백, margin-bottom = 카드 사이 간격 */
    .menu-item {
      padding: 20px 20px 18px;
      margin-bottom: 14px;
    }
    .menu-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }
    .menu-name { font-size: 19px; }
    /* 가격: 조금 크고 진하게 + 포인트 색 (더 눈에 띄게 하려면 font-size를 키우세요) */
    .menu-price { font-size: 19px; font-weight: bold; color: var(--sky-strong); white-space: nowrap; }
    .menu-desc {
      font-size: 15px;
      color: var(--ink-soft);
      margin-top: 6px;
    }

    /* ===== 3. 맨 아래: 영업시간·전화 ===== */
    footer { padding: 24px 22px 24px; margin-top: 8px; }
    footer h3 { font-size: 19px; font-weight: normal; margin-bottom: 12px; }
    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 16px;
      padding: 9px 0;
      border-bottom: 1px dashed rgba(47, 74, 94, 0.2);
    }
    .info-row:last-of-type { border-bottom: none; }
    .info-row span:first-child { color: var(--ink-soft); white-space: nowrap; }
    .info-row span:last-child { text-align: right; }
    /* 인스타 링크: 글자는 그대로 두고 눌리는 영역만 위아래로 넓혀서 손가락으로 누르기 편하게 해요 */
    .info-row a {
      color: var(--sky-strong);
      display: inline-block;
      padding: 12px 0 12px 12px;
      margin: -12px 0;
    }

    /* 전화 걸기 버튼: min-height = 버튼 높이 */
    .call-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      text-align: center;
      text-decoration: none;
      background: var(--sky-strong);
      color: #fff;
      font-family: inherit;
      font-size: 18px;
      border-radius: 18px;
      margin-top: 20px;
      box-shadow: 0 8px 18px rgba(63, 134, 184, 0.35);
    }
    .call-btn:active { transform: scale(0.98); }

    /* ===== '맨 위로' 버튼: 아래로 조금 내리면 오른쪽 아래에 나타나요 (길게 스크롤할 때 편해요) ===== */
    .to-top {
      position: fixed;
      right: 16px;
      bottom: 20px;
      width: 52px;
      height: 52px;
      border: none;
      border-radius: 50%;
      font-family: inherit;
      font-size: 22px;
      color: #fff;
      background: var(--sky-strong);
      box-shadow: 0 8px 18px rgba(63, 134, 184, 0.4);
      cursor: pointer;
      z-index: 20;
      opacity: 0;
      pointer-events: none;           /* 숨겨져 있을 때는 눌리지 않게 */
      transition: opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .to-top.show { opacity: 1; pointer-events: auto; }

    /* ===== 휴대폰을 가로로 돌렸을 때 (화면 높이가 낮을 때) =====
       - 위쪽 버튼 줄이 화면을 너무 많이 차지하지 않게 따라다니지 않도록 하고
       - 위아래 여백을 줄이고, 내용 폭을 조금 넓혀요. */
    @media (orientation: landscape) and (max-height: 520px) {
      .page { max-width: 560px; padding-top: 16px; padding-bottom: 80px; }
      header { padding: 8px 0 16px; }
      header h1 { font-size: 30px; margin: 4px 0 6px; }
      .tabs { position: static; margin-bottom: 18px; }
      .category { scroll-margin-top: 16px; }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- ===== 1. 맨 위: 가게 이름과 한 줄 소개 =====
         글자만 바꾸면 됩니다. -->
    <header>
      <p class="location">광주 북구 비엔날레</p>
      <h1>브릿지 커피</h1>
      <p class="intro">매일 직접 볶는 스페셜티 커피</p>
    </header>

    <!-- 카테고리 버튼: 화면 위쪽에 가로로 놓입니다. (전체 + 메뉴 정보의 카테고리 이름들이 자동으로 만들어져요) -->
    <nav class="tabs glass" id="tabs"></nav>

    <!-- 시그니처 메뉴 (위 메뉴 정보에서 '시그니처: true'인 메뉴가 자동으로 나옵니다)
         '전체' 버튼일 때만 보이고, 다른 카테고리를 누르면 숨겨져요. -->
    <div id="signature-area">
      <p class="section-title">★ 시그니처 메뉴</p>
      <div class="signature-list" id="signature-list"></div>
    </div>

    <!-- ===== 2. 가운데: 메뉴 목록 (자바스크립트가 아래 데이터로 자동으로 그려줍니다) ===== -->
    <main id="menu"></main>

    <!-- ===== 3. 맨 아래: 영업시간과 전화 걸기 ===== -->
    <footer class="glass">
      <h3>매장 안내</h3>
      <!-- 영업시간·전화번호·인스타 등은 아래 글자만 바꾸세요 -->
      <div class="info-row"><span>평일</span><span>08:00 ~ 21:00</span></div>
      <div class="info-row"><span>주말</span><span>10:00 ~ 20:00</span></div>
      <div class="info-row"><span>휴무</span><span>목요일</span></div>
      <div class="info-row"><span>주차</span><span>2대 가능</span></div>
      <div class="info-row"><span>좌석</span><span>1인 좌석 6석</span></div>
      <div class="info-row"><span>인스타</span><span><a href="https://www.instagram.com/bridge_coffee" target="_blank" rel="noopener">@bridge_coffee</a></span></div>

      <!-- 전화번호를 바꿀 때: 아래 href의 숫자(하이픈 없이)와 버튼 글자 두 곳을 같이 바꾸세요 -->
      <a class="call-btn" href="tel:0620000000">📞 전화 걸기 (062-000-0000)</a>
    </footer>

  </div>

  <!-- 맨 위로 올라가는 버튼 (스크롤을 내리면 자동으로 나타나요) -->
  <button type="button" class="to-top" id="to-top" aria-label="맨 위로">↑</button>

  <script>
    /* 메뉴 정보(가격·이름·설명)는 이 파일 맨 위쪽의 "메뉴 정보" 칸으로 옮겼습니다. 메뉴를 고칠 때는 위로 가세요. */

    /* ---------- 아래부터는 화면을 그리는 코드입니다. 보통은 건드리지 않아도 됩니다. ---------- */

    // 4500 -> "4,500원"
    function 원(가격) {
      return 가격.toLocaleString("ko-KR") + "원";
    }

    const 메뉴칸 = document.getElementById("menu");
    const 탭칸 = document.getElementById("tabs");
    const 대표칸 = document.getElementById("signature-list");

    메뉴.forEach(function (묶음, 번호) {
      const 아이디 = "cat-" + 번호;

      // 카테고리 버튼 (예전 방식: 누르면 그 위치로 스크롤. 지금은 아래 "필터 버튼"으로 대체해서 쓰지 않아요)
      /*
      const 탭 = document.createElement("a");
      탭.href = "#" + 아이디;
      탭.textContent = 묶음.카테고리;
      탭칸.appendChild(탭);
      */

      // 카테고리 제목 + 메뉴 카드들
      const 구역 = document.createElement("section");
      구역.className = "category";
      구역.id = 아이디;

      const 제목 = document.createElement("h2");
      제목.textContent = 묶음.카테고리;
      구역.appendChild(제목);

      묶음.목록.forEach(function (항목) {
        const 카드 = document.createElement("div");
        카드.className = "menu-item glass";

        const 윗줄 = document.createElement("div");
        윗줄.className = "menu-top";

        const 이름 = document.createElement("span");
        이름.className = "menu-name";
        이름.textContent = 항목.이름;

        // 시그니처: true 이면 이름 옆에 배지(사장님 추천)를 달고 카드를 살짝 강조합니다
        if (항목.시그니처) {
          카드.classList.add("is-signature");
          const 배지 = document.createElement("span");
          배지.className = "tag";
          배지.textContent = 배지글자;
          이름.appendChild(배지);
        }
        // 품절: 1 이면 카드를 흐리게 하고 '오늘 품절' 표시를 답니다
        if (항목.품절 === 1) {
          카드.classList.add("is-soldout");
          const 품절표시 = document.createElement("span");
          품절표시.className = "tag soldout-tag";
          품절표시.textContent = 품절글자;
          이름.appendChild(품절표시);
        }

        const 가격 = document.createElement("span");
        가격.className = "menu-price";
        가격.textContent = 원(항목.가격);

        윗줄.appendChild(이름);
        윗줄.appendChild(가격);

        const 설명 = document.createElement("p");
        설명.className = "menu-desc";
        설명.textContent = 항목.설명;

        카드.appendChild(윗줄);
        카드.appendChild(설명);
        구역.appendChild(카드);

        // 화면 맨 위 '시그니처 메뉴' 칸의 카드
        if (항목.시그니처) {
          const 대표 = document.createElement("div");
          대표.className = "signature glass" + (항목.품절 === 1 ? " is-soldout" : "");
          const 표시 = document.createElement("span");
          표시.className = "badge";
          표시.textContent = (항목.품절 === 1) ? 품절글자 : 배지글자;
          const 대표이름 = document.createElement("p");
          대표이름.className = "name";
          대표이름.textContent = 항목.이름;
          const 대표가격 = document.createElement("p");
          대표가격.className = "price";
          대표가격.textContent = 원(항목.가격);
          대표.appendChild(표시);
          대표.appendChild(대표이름);
          대표.appendChild(대표가격);
          대표칸.appendChild(대표);
        }
      });

      메뉴칸.appendChild(구역);
    });

    // (예전 방식) 스크롤하면 지금 보는 카테고리 버튼이 진하게 표시되던 코드. 지금은 쓰지 않아 막아 두었어요.
    /*
    const 탭들 = Array.from(탭칸.querySelectorAll("a"));
    const 구역들 = Array.from(document.querySelectorAll(".category"));

    function 현재탭표시() {
      let 현재 = 0;
      구역들.forEach(function (구역, i) {
        if (구역.getBoundingClientRect().top < 140) 현재 = i;
      });
      탭들.forEach(function (탭, i) {
        탭.classList.toggle("active", i === 현재);
      });
    }
    window.addEventListener("scroll", 현재탭표시, { passive: true });
    현재탭표시();
    */

    /* =====================================================
       카테고리 필터 버튼 (전체 / 커피 / 논커피 / 디저트)
       - 버튼 이름은 맨 위 "메뉴 정보"의 카테고리 이름으로 자동으로 만들어져요.
       - 맨 앞의 "전체" 글자를 바꾸고 싶으면 아래 첫 번째 줄의 "전체"만 고치세요.
       - 처음 화면에는 '전체'가 선택돼 있고, 시그니처 메뉴 칸은 '전체'일 때만 보여요.
       ===================================================== */
    const 버튼이름들 = ["전체"].concat(메뉴.map(function (묶음) { return 묶음.카테고리; }));
    const 모든구역 = Array.from(document.querySelectorAll(".category"));
    const 대표영역 = document.getElementById("signature-area");
    const 필터버튼들 = [];

    // 번호 0 = 전체, 1 = 첫 번째 카테고리(커피), 2 = 두 번째(논커피) ...
    function 카테고리선택(번호) {
      모든구역.forEach(function (구역, i) {
        // 전체(0)이면 전부 보이고, 아니면 선택한 카테고리만 보임
        구역.classList.toggle("hidden", 번호 !== 0 && i !== 번호 - 1);
      });
      대표영역.classList.toggle("hidden", 번호 !== 0);   // 대표 메뉴는 '전체'일 때만
      필터버튼들.forEach(function (버튼, i) {
        버튼.classList.toggle("active", i === 번호);       // 선택된 버튼만 색이 달라져요
      });
    }

    버튼이름들.forEach(function (이름, 번호) {
      const 버튼 = document.createElement("button");
      버튼.type = "button";
      버튼.textContent = 이름;
      버튼.addEventListener("click", function () {
        카테고리선택(번호);
        // 버튼 바로 아래 메뉴 시작 위치로 부드럽게 올려 줍니다
        const 위치 = 메뉴칸.getBoundingClientRect().top + window.scrollY - 80;
        if (window.scrollY > 위치) window.scrollTo({ top: 위치, behavior: "smooth" });
      });
      탭칸.appendChild(버튼);
      필터버튼들.push(버튼);
    });

    카테고리선택(0);   // 처음 들어오면 '전체'가 선택된 상태

    // '맨 위로' 버튼: 400px 이상 내리면 나타나고, 누르면 맨 위로 올라가요
    const 맨위버튼 = document.getElementById("to-top");
    window.addEventListener("scroll", function () {
      맨위버튼.classList.toggle("show", window.scrollY > 400);
    }, { passive: true });
    맨위버튼.addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  </script>
</body>
</html>
