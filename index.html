<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 👇 휴대폰 화면에 맞춰주는 아주 중요한 한 줄입니다. 지우지 마세요! -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 👇 아이폰이 맨 아래 전화번호 글자를 제멋대로 파란 링크로 바꾸지 못하게 막습니다
         ('전화 걸기' 버튼은 그대로 잘 작동합니다) -->
  <meta name="format-detection" content="telephone=no">

  <!-- 👇 손님 휴대폰 위쪽(브라우저 탭)에 보이는 이름입니다 -->
  <title>브릿지 커피 메뉴판</title>

  <!-- 👇 '고운 돋움' 글꼴을 인터넷에서 불러옵니다 (인터넷이 안 되면 '맑은 고딕'으로 나옵니다) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">


  <!--
  ██████████████████████████████████████████████████████████████████
  ★★★ 여기가 메뉴를 고치는 곳입니다 ★★★
  메뉴 이름 · 가격 · 설명은 전부 아래 목록 한 곳에만 적혀 있습니다.
  여기만 고치면 손님 화면이 자동으로 바뀝니다.
  (아래쪽 코드는 건드리지 않으셔도 됩니다!)
  ██████████████████████████████████████████████████████████████████
  -->
  <script>

    /* ==================================================================
       📖 사용 설명서 — 천천히 읽어보세요

       메뉴 하나는 아래처럼 딱 한 줄로 적혀 있습니다.

           { 이름: "아메리카노", 가격: "4,500원", 설명: "고소한 원두", 추천: 0, 품절: 0 },
             └─ 1번 ─┘         └─ 2번 ─┘        └── 3번 ──┘      └4번┘    └5번┘

           1번 이름 : 손님에게 보여줄 메뉴 이름
           2번 가격 : 가격 (숫자만 쓰지 말고 "원"까지 같이 적어주세요)
           3번 설명 : 메뉴 아래 작게 나오는 한 줄 설명
           4번 추천 : ⭐ '사장님 추천' 배지를 달지 말지  (아래 ⭐ 설명 참고)
           5번 품절 : '오늘 품절' 표시를 띄울지 말지    (아래 🚫 설명 참고)

       ⚠️ 꼭 지켜야 할 3가지 약속 ⚠️
         ① 글자 양쪽의 큰따옴표( " )를 지우면 안 됩니다.
         ② 줄 맨 끝의 쉼표( , )를 지우면 안 됩니다.
         ③ 중괄호 { } 와 대괄호 [ ] 도 지우면 안 됩니다.
            → 이 중 하나라도 지워지면 메뉴가 아예 안 보입니다.
              (혹시 화면이 하얗게 나오면 붙여넣기 전으로 되돌리세요)

       ------------------------------------------------------------------
       ✅ 가격만 바꾸고 싶을 때
          "4,500원" 안의 숫자만 고칩니다.  →  "5,000원"

       ✅ 메뉴를 추가하고 싶을 때
          기존 메뉴 한 줄을 통째로 복사(Ctrl+C) 해서
          바로 아래에 붙여넣기(Ctrl+V) 한 뒤, 이름·가격·설명만 바꾸세요.

       ✅ 메뉴를 없애고 싶을 때
          그 줄 전체를 지웁니다. (줄 끝 쉼표까지 같이 지우세요)

       ✅ 잠깐 안 팔지만 나중에 다시 팔 메뉴는
          줄 맨 앞에 빗금 두 개( // )를 붙이면 화면에서 숨겨집니다.
          다시 팔 때는 그 // 만 지우면 됩니다.
          (예)  // { 이름: "쑥 라떼", 가격: "5,500원", 설명: "..." },

       ✅ 분류(커피 / 논커피 / 디저트)를 바꾸고 싶을 때
          분류: "커피"  ← 이 글자를 바꾸면 화면의 제목이 바뀝니다.
          분류를 새로 만들고 싶으면 아래 '분류 통째로 복사하는 법'을 보세요.

       ==================================================================
       🔢 4번·5번 칸은 '숫자 한 글자'로 켜고 끕니다 🔢

                    1 = 켜기        0 = 끄기

          숫자 하나만 고치면 됩니다. 1 위에 0 을 덮어쓰거나,
          0 을 지우고 1 을 치면 끝입니다.

       ==================================================================
       ⭐⭐⭐ 4번 칸 — '사장님 추천' 배지 달기 / 떼기 ⭐⭐⭐

          추천: 1   ← 배지가 달립니다 (카드도 살짝 도드라집니다)
          추천: 0   ← 배지가 없는 보통 메뉴가 됩니다

          👉 배지를 달고 싶은 메뉴 줄의 0 을 1 로 바꾸세요.
          👉 떼고 싶으면 반대로 1 을 0 으로 바꾸세요.

       ==================================================================
       🚫🚫🚫 5번 칸 — '오늘 품절' 표시 켜기 / 끄기 🚫🚫🚫

          품절: 1   ← 카드가 흐려지고 '오늘 품절' 표시가 뜹니다
          품절: 0   ← 평소처럼 정상으로 보입니다

          👉 오늘 재료가 떨어졌으면 그 메뉴 줄의 0 을 1 로 바꾸고
             저장(Ctrl+S)하면 끝입니다. 메뉴를 지울 필요가 없어요!
          👉 내일 다시 팔 때는 1 을 0 으로 되돌리면 됩니다.

          💡 편하게 하는 요령
             숫자 바로 오른쪽을 클릭하고 백스페이스( ← ) 한 번 누른 뒤
             새 숫자를 치면 가장 빠릅니다.

          ⚠️ 숫자에는 따옴표를 붙이지 마세요.
             ⭕ 품절: 1      ❌ 품절: "1"
       ================================================================== */

    const 메뉴목록 = [

      /* ───────────────────────────────────────────────
         ☕ 첫 번째 분류
         ─────────────────────────────────────────────── */
      {
        분류: "커피",          // 👈 화면에 보이는 분류 제목
        메뉴들: [
          { 이름: "아메리카노",        가격: "4,800원", 설명: "산미가 적은 고소한 원두",          추천: 0, 품절: 0 },
          { 이름: "카페라떼",          가격: "5,000원", 설명: "부드러운 우유 거품",              추천: 0, 품절: 0 },
          { 이름: "바닐라 라떼",       가격: "5,500원", 설명: "바닐라빈을 직접 우려낸 시럽",      추천: 0, 품절: 0 },
          { 이름: "아인슈페너",        가격: "5,800원", 설명: "단맛을 줄인 수제 크림",           추천: 1, 품절: 0 },
          { 이름: "콜드브루",          가격: "5,300원", 설명: "12시간 저온 추출, 목넘김이 깔끔함", 추천: 0, 품절: 0 },
          { 이름: "디카페인 아메리카노", 가격: "5,000원", 설명: "카페인 걱정 없이 편하게",         추천: 0, 품절: 1 },
          // 👆 커피 메뉴를 더 넣으려면 위 줄을 복사해서 이 자리에 붙여넣으세요
        ]
      },

      /* ───────────────────────────────────────────────
         🥛 두 번째 분류
         ─────────────────────────────────────────────── */
      {
        분류: "논커피",
        메뉴들: [
          { 이름: "흑임자 라떼", 가격: "5,500원", 설명: "국산 흑임자를 직접 갈아 넣음", 추천: 1, 품절: 0 },
          { 이름: "말차 라떼",   가격: "5,800원", 설명: "우지 말차, 쌉쌀한 맛이 진함",  추천: 0, 품절: 0 },
          { 이름: "쑥 라떼",     가격: "5,500원", 설명: "강화도 쑥, 은은하고 담백함",   추천: 0, 품절: 1 },
          { 이름: "곡물 라떼",   가격: "5,300원", 설명: "볶은 곡물의 구수한 맛",        추천: 0, 품절: 0 },
          { 이름: "자몽에이드",  가격: "6,000원", 설명: "생과일 자몽 과육을 그대로",    추천: 0, 품절: 0 },
          // 👆 논커피 메뉴를 더 넣으려면 위 줄을 복사해서 이 자리에 붙여넣으세요
        ]
      },

      /* ───────────────────────────────────────────────
         🍰 세 번째 분류
         ─────────────────────────────────────────────── */
      {
        분류: "디저트",
        메뉴들: [
          { 이름: "치즈케이크",      가격: "6,500원", 설명: "굽지 않은 부드러운 식감",       추천: 0, 품절: 0 },
          { 이름: "당근케이크",      가격: "6,000원", 설명: "견과류를 넉넉히 넣음",          추천: 0, 품절: 0 },
          { 이름: "스콘",            가격: "4,000원", 설명: "겉은 바삭 속은 촉촉, 잼과 함께", 추천: 0, 품절: 0 },
          { 이름: "바스크 치즈케이크", 가격: "6,800원", 설명: "겉면을 진하게 태운 풍미",       추천: 0, 품절: 0 },
          // 👆 디저트 메뉴를 더 넣으려면 위 줄을 복사해서 이 자리에 붙여넣으세요
        ]
      },

      /* ==================================================================
         📦 분류를 통째로 새로 만드는 법 (예: '계절 메뉴', '베이커리')

         아래 5줄을 복사해서 이 자리(바로 윗줄 } 와 아래 ] 사이)에
         붙여넣은 뒤, // 빗금 두 개를 지우고 내용을 바꾸세요.

         // {
         //   분류: "계절 메뉴",
         //   메뉴들: [
         //     { 이름: "수박주스", 가격: "6,500원", 설명: "여름에만 만나요", 추천: 0, 품절: 0 },
         //   ]
         // },
         ================================================================== */

    ];
    // 👆 이 대괄호 ] 와 세미콜론 ; 은 메뉴 목록의 '끝' 표시입니다. 지우지 마세요!


    /* ==================================================================
       🏷️ 배지에 적히는 글자 — 바꾸고 싶으면 따옴표 안만 고치세요
       ================================================================== */

    // 👇 추천 메뉴에 붙는 글자 (예: "⭐ 인기 메뉴", "⭐ 신메뉴")
    const 추천배지글자 = "⭐ 사장님 추천";

    // 👇 품절된 메뉴에 붙는 글자 (예: "재료 소진", "내일 만나요")
    const 품절배지글자 = "오늘 품절";

  </script>
  <!-- ★★★ 메뉴 고치는 곳은 여기까지입니다 ★★★ -->


  <style>
    /* ============================================================
       🎨 색깔 모음 — 여기 색깔 코드만 바꾸면 전체 분위기가 바뀝니다
       ============================================================ */
    :root {
      /* ▼ 우리 가게 대표 색 두 가지 ▼ */
      --짙은갈색: #3E2B23;   /* 대표색 1 — 글자, 버튼, 강조에 쓰입니다 */
      --크림색:   #FBF4E9;   /* 대표색 2 — 배경, 버튼 글씨에 쓰입니다 */

      /* ▼ 위 두 색에서 뽑아낸 보조 색들 ▼ */
      --배경색1: #FDF8F0;   /* 배경 맨 위 (가장 밝은 크림) */
      --배경색2: #F2E3D0;   /* 배경 가운데 (살구빛 크림) */
      --배경색3: #E2CBB0;   /* 배경 맨 아래 (연한 갈색) */
      --글자색:  #3E2B23;    /* 기본 글자 색 */
      --연한글자: #7A6455;   /* 설명글처럼 덜 중요한 글자 색 */
      --가격색:  #5A3B2C;    /* 가격 글자 색 (조금 더 진하게) */
      --버튼색:  #4A3428;    /* 전화 버튼 · 선택된 버튼 바탕색 */
      --그림자:  rgba(62, 43, 35, 0.10);   /* 부드러운 그림자 색 */
    }

    /* 기본 여백 정리 (건드리지 않아도 됩니다) */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 화면 전체 바탕 — 위에서 아래로 은은하게 번지는 크림빛 그라데이션 */
    html {
      background: linear-gradient(170deg,
                  var(--배경색1) 0%,
                  var(--배경색2) 55%,
                  var(--배경색3) 100%);
      background-attachment: fixed;
      min-height: 100%;
    }

    /* 배경에 깔리는 은은한 빛 얼룩 — 유리 카드가 더 예쁘게 비치게 해줍니다 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;    /* 손가락 터치를 방해하지 않게 */
      background:
        radial-gradient(circle at 15% 12%, rgba(255, 255, 255, 0.85) 0%, transparent 45%),
        radial-gradient(circle at 88% 30%, rgba(196, 154, 108, 0.30) 0%, transparent 42%),
        radial-gradient(circle at 25% 82%, rgba(140, 100, 70, 0.22) 0%, transparent 48%);
    }

    body {
      /* 👇 글꼴 순서: 고운 돋움 → 없으면 맑은 고딕 */
      font-family: 'Gowun Dodum', 'Malgun Gothic', sans-serif;
      color: var(--글자색);
      background: transparent;

      min-height: 100vh;
      /* 👇 휴대폰 주소창 높이까지 계산해서 아래쪽에 빈칸이 생기지 않게 합니다
             (윗줄 100vh는 옛날 휴대폰용 예비값이라 같이 둡니다) */
      min-height: 100dvh;
      padding: 40px 20px 48px;   /* 위·옆·아래 여백을 넉넉하게 */

      /* 휴대폰(390px)에 딱 맞추고, 큰 화면에서는 가운데에 놓습니다 */
      max-width: 390px;
      margin: 0 auto;

      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       1️⃣ 맨 위 — 가게 이름과 소개
       ============================================================ */
    .가게소개 {
      text-align: center;
      margin-bottom: 36px;
    }

    .가게아이콘 {
      font-size: 44px;
      display: block;
      margin-bottom: 14px;
    }

    .가게이름 {
      font-size: 31px;
      letter-spacing: 3px;
      margin-bottom: 12px;
      color: var(--짙은갈색);
    }

    .한줄소개 {
      font-size: 16px;         /* 👈 휴대폰에서 편하게 읽히도록 16px로 맞췄습니다 */
      line-height: 1.75;
      color: var(--연한글자);
    }

    /* 소개 아래 얇은 구분선 */
    .구분선 {
      width: 54px;
      height: 2px;
      margin: 22px auto 0;
      background: linear-gradient(90deg,
                  transparent, rgba(62, 43, 35, 0.35), transparent);
      border-radius: 2px;
    }

    /* ============================================================
       2️⃣ 카테고리 버튼 줄 (전체 / 커피 / 논커피 / 디저트)
       ============================================================ */

    /* 버튼들을 가로로 나란히 놓는 줄 */
    .카테고리버튼줄 {
      display: flex;
      gap: 9px;                    /* 버튼 사이 간격 */
      margin-bottom: 34px;

      /* 👇 손님이 아래로 스크롤해도 버튼 줄이 화면 맨 위에 붙어서 따라옵니다.
             (메뉴를 한참 보다가도 분류를 바로 바꿀 수 있습니다)
             고정을 없애고 싶으면 아래 position 줄만 지우세요 */
      position: sticky;
      top: 0;
      z-index: 20;                 /* 메뉴 카드보다 위에 놓입니다 */

      /* 버튼 줄 바탕이 화면 좌우 끝까지 닿게 만듭니다 (카드가 옆으로 비쳐 보이지 않게) */
      margin-left: -20px;
      margin-right: -20px;
      padding: 12px 20px 14px;
      background: rgba(253, 248, 240, 0.72);   /* 살짝 비치는 크림색 바탕 */
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      /* 버튼이 많아지면 옆으로 밀어서 볼 수 있게 합니다 */
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;       /* 스크롤 막대 숨기기 */
    }
    .카테고리버튼줄::-webkit-scrollbar { display: none; }

    /* 버튼 한 개의 기본 모습 (선택되지 않은 상태 — 반투명 유리) */
    .카테고리버튼 {
      flex: 0 0 auto;              /* 글자가 길어도 찌그러지지 않게 */
      min-height: 52px;            /* 👈 손가락으로 누르기 편한 높이 */
      padding: 0 20px;

      background: rgba(255, 255, 255, 0.45);          /* 반투명 흰 유리 */
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 26px;
      box-shadow: 0 6px 18px var(--그림자);

      font-family: inherit;
      font-size: 16px;             /* 👈 글자도 넉넉하게 */
      color: var(--글자색);
      white-space: nowrap;
      cursor: pointer;

      transition: background 0.25s, color 0.25s, box-shadow 0.25s;
    }

    /* 👇 지금 눌러서 '선택된' 버튼의 모습 (짙은 갈색 바탕 + 크림색 글씨) */
    .카테고리버튼.선택됨 {
      background: var(--버튼색);     /* 색을 바꾸려면 맨 위 '색깔 모음'의 --버튼색을 고치세요 */
      color: var(--크림색);
      border-color: rgba(62, 43, 35, 0.5);
      box-shadow: 0 8px 20px rgba(62, 43, 35, 0.28);
    }

    /* 버튼을 손가락으로 누르는 순간 살짝 눌리는 느낌 */
    .카테고리버튼:active {
      transform: scale(0.96);
    }

    /* ============================================================
       3️⃣ 가운데 — 메뉴 목록
       ============================================================ */

    /* 분류 제목 (커피 / 논커피 / 디저트) */
    .분류제목 {
      font-size: 16px;
      color: var(--연한글자);
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 6px;
      font-weight: normal;
    }

    /* 분류와 분류 사이의 간격 (넉넉하게 띄웁니다) */
    .분류묶음 {
      margin-bottom: 44px;
    }

    /* 🥛 유리처럼 비치는 카드 (글래스모피즘) */
    .메뉴카드 {
      background: rgba(255, 255, 255, 0.42);          /* 반투명 흰색 */
      backdrop-filter: blur(16px);                    /* 뒤 배경이 뿌옇게 비침 */
      -webkit-backdrop-filter: blur(16px);            /* 아이폰 사파리용 */
      border: 1px solid rgba(255, 255, 255, 0.72);    /* 얇고 밝은 테두리 */
      border-radius: 24px;                            /* 👈 둥근 모서리 (숫자를 키우면 더 동글) */
      box-shadow: 0 10px 30px var(--그림자);           /* 넓고 부드러운 그림자 */
      padding: 22px 22px;                             /* 카드 안쪽 여백 */
      margin-bottom: 16px;                            /* 카드 사이 간격 */
    }

    /* 메뉴 이름과 가격을 좌우 양쪽으로 벌려 놓습니다 */
    .메뉴윗줄 {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 9px;
    }

    .메뉴이름 {
      font-size: 19px;
      line-height: 1.35;
      color: var(--짙은갈색);
    }

    /* 👇 가격 — 눈에 잘 띄게 크고 진하게 */
    .메뉴가격 {
      font-size: 20px;         /* 숫자를 키우면 가격이 더 커집니다 */
      font-weight: 700;        /* 굵게 */
      color: var(--가격색);
      letter-spacing: 0.3px;
      white-space: nowrap;     /* 가격이 두 줄로 쪼개지지 않게 */
    }

    .메뉴설명 {
      font-size: 16px;         /* 👈 휴대폰에서 편하게 읽히도록 16px로 맞췄습니다 */
      line-height: 1.65;
      color: var(--연한글자);
    }

    /* ============================================================
       🏷️ 배지 — '사장님 추천' 과 '오늘 품절' 표시
       ============================================================ */

    /* 배지가 놓이는 줄 (메뉴 이름 바로 위) */
    .배지줄 {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    /* 배지 한 개의 공통 모습 (알약처럼 생긴 작은 딱지) */
    .배지 {
      display: inline-block;
      font-size: 13px;        /* 👈 너무 작아 안 보이지 않게 조금 키웠습니다 */
      letter-spacing: 0.5px;
      padding: 5px 12px;
      border-radius: 999px;   /* 숫자를 크게 주면 양끝이 완전히 동그래집니다 */
      white-space: nowrap;
    }

    /* ⭐ 사장님 추천 배지 (금빛) */
    .배지.추천배지 {
      background: linear-gradient(135deg, #C8963E, #A9762A);
      color: #FFF8EA;
      box-shadow: 0 3px 10px rgba(169, 118, 42, 0.35);
    }

    /* 🚫 오늘 품절 배지 (차분한 회갈색) */
    .배지.품절배지 {
      background: rgba(90, 74, 66, 0.85);
      color: var(--크림색);
    }

    /* ------------------------------------------------------------
       ⭐ 추천 메뉴 카드 — 보통 카드보다 한 단계 도드라지게
       ------------------------------------------------------------ */
    .메뉴카드.추천카드 {
      background: rgba(255, 250, 240, 0.62);            /* 조금 더 진한 크림빛 */
      border: 1.5px solid rgba(200, 150, 62, 0.55);     /* 은은한 금빛 테두리 */
      box-shadow: 0 12px 34px rgba(140, 100, 40, 0.18); /* 그림자도 조금 더 깊게 */
    }

    /* 추천 카드의 메뉴 이름은 살짝 굵게 */
    .메뉴카드.추천카드 .메뉴이름 {
      font-weight: 700;
    }

    /* ------------------------------------------------------------
       🚫 품절된 메뉴 카드 — 흐리게 보이게
       ------------------------------------------------------------ */
    .메뉴카드.품절카드 {
      /* ⚠️ 카드 전체를 흐리게(opacity) 만들면 그 안의 '오늘 품절' 글자까지
             같이 흐려져서 잘 안 보입니다. 그래서 카드 전체가 아니라
             바로 아래에서 '이름 · 가격 · 설명'만 연하게 만듭니다. */
      background: rgba(255, 255, 255, 0.28);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 6px 18px var(--그림자);
    }

    /* 👇 품절 메뉴의 글자만 연하게 (숫자가 작을수록 더 흐려집니다) */
    .메뉴카드.품절카드 .메뉴이름,
    .메뉴카드.품절카드 .메뉴가격,
    .메뉴카드.품절카드 .메뉴설명 {
      opacity: 0.5;
    }

    /* 품절 메뉴는 가격에 취소선을 그어 확실히 알려줍니다 */
    .메뉴카드.품절카드 .메뉴가격 {
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
    }

    /* 품절 배지만은 흐려지지 않게 또렷하게 남겨둡니다 */
    .메뉴카드.품절카드 .배지.품절배지 {
      opacity: 1;
    }

    /* ============================================================
       4️⃣ 맨 아래 — 영업시간과 전화 걸기 버튼
       ============================================================ */
    .가게정보 {
      background: rgba(255, 255, 255, 0.42);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 24px;
      box-shadow: 0 10px 30px var(--그림자);
      padding: 28px 22px;
      margin-top: 10px;
      text-align: center;
    }

    .영업시간라벨 {
      font-size: 13px;
      color: var(--연한글자);
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .영업시간 {
      font-size: 18px;
      color: var(--짙은갈색);
      margin-bottom: 24px;
    }

    /* 📞 전화 걸기 버튼 (손가락으로 누르기 쉽게 크게 만들었습니다) */
    .전화버튼 {
      /* 👇 글자가 길어져서 두 줄이 되어도 버튼 가운데에 오도록 맞춥니다 */
      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      min-height: 56px;        /* 👈 버튼 높이 (숫자를 키우면 버튼이 두꺼워집니다) */
      padding: 14px 16px;
      line-height: 1.4;

      background: var(--버튼색);
      color: var(--크림색);
      font-family: inherit;
      font-size: 18px;
      letter-spacing: 1.5px;

      border: none;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(62, 43, 35, 0.28);

      text-decoration: none;   /* 밑줄 없애기 */
      cursor: pointer;
      transition: box-shadow 0.2s;
    }

    /* 버튼을 손가락으로 누르는 순간 살짝 눌리는 느낌 */
    .전화버튼:active {
      transform: scale(0.97);
      box-shadow: 0 3px 10px rgba(62, 43, 35, 0.25);
    }

    .전화번호안내 {
      font-size: 15px;        /* 👈 나이 있는 손님도 읽기 쉽게 조금 키웠습니다 */
      color: var(--연한글자);
      margin-top: 14px;
      letter-spacing: 0.5px;
    }

    /* ============================================================
       📱 화면이 특별한 경우에만 살짝 조절하는 부분
          (아래 두 덩어리는 평소에는 아무 일도 하지 않습니다)
       ============================================================ */

    /* ① 아주 좁은 휴대폰 (가로 360px 이하 — 옛날 아이폰 등)
          분류 버튼 4개가 화면 밖으로 밀리지 않게 좌우 여백만 줄입니다.
          버튼 높이(52px)는 그대로라 누르기는 똑같이 편합니다. */
    @media (max-width: 360px) {
      .카테고리버튼줄 {
        gap: 6px;
      }
      .카테고리버튼 {
        padding: 0 11px;
      }
    }

    /* ② 휴대폰을 가로로 돌렸을 때 (화면 높이가 짧아진 경우)
          맨 위 가게 소개가 화면을 다 차지해서 메뉴가 안 보이는 걸 막습니다.
          → 소개 부분만 조금 작게 줄여서 메뉴가 바로 보이게 합니다. */
    @media (orientation: landscape) and (max-height: 520px) {
      body {
        padding-top: 20px;
      }
      .가게소개 {
        margin-bottom: 18px;
      }
      .가게아이콘 {
        font-size: 30px;
        margin-bottom: 6px;
      }
      .가게이름 {
        font-size: 25px;
        margin-bottom: 6px;
      }
      .구분선 {
        margin-top: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- ==========================================================
       1️⃣ 맨 위 — 가게 이름과 한 줄 소개
       ========================================================== -->
  <header class="가게소개">
    <!-- 👇 아이콘을 바꾸고 싶으면 아래 커피잔 그림만 다른 걸로 바꾸세요 (예: 🍰 🥐 🍵) -->
    <span class="가게아이콘">☕</span>

    <!-- 👇 가게 이름을 고치세요 -->
    <h1 class="가게이름">브릿지 커피</h1>

    <!-- 👇 한 줄 소개를 고치세요 -->
    <p class="한줄소개">매일 아침 로스팅해서 내려드리는<br>스페셜 커피 전문점</p>

    <div class="구분선"></div>
  </header>

  <!-- ==========================================================
       2️⃣ 카테고리 버튼이 자동으로 채워지는 자리

       ⚠️ 이 안도 비워두는 게 맞습니다! 지우거나 채우지 마세요.
       맨 위 '메뉴목록'에 적힌 분류 이름을 읽어서
       버튼('전체' + 분류들)이 저절로 만들어집니다.
       ========================================================== -->
  <nav id="버튼이들어갈자리" class="카테고리버튼줄"></nav>

  <!-- ==========================================================
       3️⃣ 가운데 — 메뉴 목록이 자동으로 채워지는 자리

       ⚠️ 이 안은 비워두는 게 맞습니다! 지우거나 채우지 마세요.
       맨 위의 '메뉴목록'을 읽어서 컴퓨터가 알아서 카드를 만들어 넣습니다.
       ========================================================== -->
  <main id="메뉴가들어갈자리"></main>

  <!-- ==========================================================
       4️⃣ 맨 아래 — 영업시간과 전화 걸기 버튼
       ========================================================== -->
  <footer class="가게정보">
    <p class="영업시간라벨">영 업 시 간</p>

    <!-- 👇 영업시간을 고치세요 -->
    <p class="영업시간">오전 8시 – 저녁 7시</p>

    <!-- 👇 전화번호를 고치세요. 아래 두 곳(tel: 뒤쪽과 안내 글)을 똑같이 바꿔주세요 -->
    <a class="전화버튼" href="tel:000-000-0000">📞 전화 걸기</a>
    <p class="전화번호안내">000-000-0000</p>
  </footer>


  <!-- ==========================================================
       ⚙️ 버튼과 메뉴를 화면에 그려주는 부분 (건드리지 않으셔도 됩니다)

       맨 위 '메뉴목록'에 적어두신 내용을 하나씩 꺼내서
       카테고리 버튼과 메뉴 카드를 자동으로 만들어 붙여줍니다.
       ========================================================== -->
  <script>
    // 버튼과 메뉴가 들어갈 빈 자리를 찾습니다
    const 버튼자리 = document.getElementById("버튼이들어갈자리");
    const 메뉴자리 = document.getElementById("메뉴가들어갈자리");

    /* 👇 '전체' 버튼의 글자를 바꾸고 싶으면 아래 따옴표 안을 고치세요
           (예: "전체" → "전체 메뉴" 또는 "ALL") */
    const 전체버튼이름 = "전체";

    /* ------------------------------------------------------------------
       ① 카테고리 버튼 만들기
       '전체' 버튼 하나 + 맨 위에 적어둔 분류 개수만큼 버튼을 만듭니다.
       → 나중에 분류를 추가하시면 버튼도 저절로 하나 더 생깁니다.
       ------------------------------------------------------------------ */
    const 버튼이름들 = [전체버튼이름];
    메뉴목록.forEach(function (분류묶음) {
      버튼이름들.push(분류묶음.분류);
    });

    버튼이름들.forEach(function (이름) {
      const 버튼 = document.createElement("button");
      버튼.className = "카테고리버튼";
      버튼.textContent = 이름;

      // 손님이 버튼을 누르면 그 분류만 다시 그립니다
      버튼.addEventListener("click", function () {
        메뉴그리기(이름);

        // 눌린 버튼에만 색을 입히고, 나머지 버튼의 색은 벗깁니다
        document.querySelectorAll(".카테고리버튼").forEach(function (다른버튼) {
          다른버튼.classList.remove("선택됨");
        });
        버튼.classList.add("선택됨");

        // 목록 맨 위로 부드럽게 올려줍니다
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      버튼자리.appendChild(버튼);
    });

    /* ------------------------------------------------------------------
       ② 메뉴 그리기
       고른분류가 "전체"면 전부, 아니면 그 분류만 화면에 그립니다.
       ------------------------------------------------------------------ */
    function 메뉴그리기(고른분류) {

      // 먼저 화면에 있던 메뉴를 모두 비웁니다
      메뉴자리.innerHTML = "";

      // 분류(커피 → 논커피 → 디저트)를 하나씩 순서대로 꺼냅니다
      메뉴목록.forEach(function (분류묶음) {

        // 👇 '전체'가 아니고, 손님이 고른 분류도 아니면 건너뜁니다
        if (고른분류 !== 전체버튼이름 && 분류묶음.분류 !== 고른분류) {
          return;
        }

        // 분류 하나를 담을 상자를 만듭니다
        const 상자 = document.createElement("section");
        상자.className = "분류묶음";

        // ① 분류 제목 만들기
        const 제목 = document.createElement("h2");
        제목.className = "분류제목";
        제목.textContent = 분류묶음.분류;
        상자.appendChild(제목);

        // ② 그 분류에 속한 메뉴들을 카드 한 장씩 만들기
        분류묶음.메뉴들.forEach(function (메뉴) {
          const 카드 = document.createElement("article");
          카드.className = "메뉴카드";

          /* 👇 메뉴 줄에 적힌 숫자를 읽습니다 (1이면 켜짐, 0이면 꺼짐)
                혹시 실수로 true 라고 쓰셔도 켜지도록 넉넉하게 만들었습니다 */
          const 추천켜짐 = (메뉴.추천 == 1);
          const 품절켜짐 = (메뉴.품절 == 1);

          // 추천/품절에 따라 카드 모습을 바꿉니다
          if (추천켜짐) 카드.classList.add("추천카드");   // 금빛 테두리로 도드라지게
          if (품절켜짐) 카드.classList.add("품절카드");   // 흐리게

          // 배지(⭐ 사장님 추천 / 오늘 품절)를 달아줍니다
          if (추천켜짐 || 품절켜짐) {
            const 배지줄 = document.createElement("div");
            배지줄.className = "배지줄";

            if (추천켜짐) {
              const 추천배지 = document.createElement("span");
              추천배지.className = "배지 추천배지";
              추천배지.textContent = 추천배지글자;
              배지줄.appendChild(추천배지);
            }

            if (품절켜짐) {
              const 품절배지 = document.createElement("span");
              품절배지.className = "배지 품절배지";
              품절배지.textContent = 품절배지글자;
              배지줄.appendChild(품절배지);
            }

            카드.appendChild(배지줄);
          }

          // 메뉴 이름과 가격이 나란히 놓이는 윗줄
          const 윗줄 = document.createElement("div");
          윗줄.className = "메뉴윗줄";

          const 이름 = document.createElement("span");
          이름.className = "메뉴이름";
          이름.textContent = 메뉴.이름;

          const 가격 = document.createElement("span");
          가격.className = "메뉴가격";
          가격.textContent = 메뉴.가격;

          윗줄.appendChild(이름);
          윗줄.appendChild(가격);

          // 메뉴 아래 작은 설명
          const 설명 = document.createElement("p");
          설명.className = "메뉴설명";
          설명.textContent = 메뉴.설명;

          카드.appendChild(윗줄);
          카드.appendChild(설명);
          상자.appendChild(카드);
        });

        // ③ 다 만든 분류 상자를 화면에 붙입니다
        메뉴자리.appendChild(상자);
      });
    }

    /* ------------------------------------------------------------------
       ③ 손님이 처음 들어왔을 때
       '전체' 버튼을 눌러둔 상태로 시작합니다.
       ------------------------------------------------------------------ */
    메뉴그리기(전체버튼이름);
    버튼자리.firstChild.classList.add("선택됨");
  </script>

</body>
</html>
