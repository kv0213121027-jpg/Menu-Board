  <style>
    /* ================================================================
       [ 1 ] 색깔 설정
       👇 [바꾸는 곳 2] 가게 색깔을 바꾸고 싶으면 여기 색상 코드만 바꾸세요
       색상 코드는 # 뒤에 오는 6글자입니다 (예: #4a3325)
       ================================================================ */
    :root {
      --배경색-위:   #4a3325;   /* 배경 위쪽 짙은 갈색 */
      --배경색-아래: #291a12;   /* 배경 아래쪽 더 진한 갈색 */
      --포인트색:    #f0dcb8;   /* 가격, 버튼에 쓰이는 크림색 */
      --글자색:      #fbf3e6;   /* 기본 글자 색 (밝은 크림색) */
      --흐린글자색:  rgba(251, 243, 230, 0.70); /* 설명글처럼 살짝 연한 글자 */
      --진한갈색:    #2b1c13;   /* 크림색 버튼 위에 올라가는 글자 색 */

      /* 👇 [바꾸는 곳 2-2] 배경 사진 위에 덮는 '갈색 막'의 진하기
         사진이 밝아서 크림색 글씨가 안 보이기 때문에 막을 한 겹 덮었습니다
         맨 뒤 숫자가 진하기입니다 (0 = 막 없음 / 1 = 사진이 안 보임)
         사진을 더 선명하게 보고 싶으면 숫자를 낮추세요 (예: 0.50)
         글자가 잘 안 보이면 숫자를 높이세요 (예: 0.90)              */
      --사진막-위:   rgba(62, 42, 30, 0.66);
      --사진막-아래: rgba(30, 19, 13, 0.88);
    }

    /* ================================================================
       [ 2 ] 기본 정리 — 브라우저마다 다른 여백을 없애줍니다
       ================================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* 손가락으로 눌렀을 때 파란 네모 안 생기게 */
    }

    html {
      /* 아이폰을 가로로 돌렸을 때 글자가 제멋대로 커지는 것을 막습니다
         (이 줄이 없으면 가로 화면에서 글자만 커져 줄이 밀립니다) */
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;

      overflow-x: hidden;   /* 옆으로 밀리는 것을 한 번 더 막습니다 */
    }

    body {
      /* 글꼴 순서: 고운 돋움 → 없으면 맑은 고딕 */
      font-family: '고운 돋움', 'Gowun Dodum', '맑은 고딕', 'Malgun Gothic', sans-serif;
      color: var(--글자색);
      min-height: 100vh;
      /* 휴대폰 브라우저의 주소창이 보였다 숨었다 할 때
         화면 높이가 어색하게 튀는 것을 막아줍니다 */
      min-height: 100dvh;

      /* 배경 사진이 안 보일 때를 대비한 '기본 배경색'입니다
         (사진 파일이 없거나 이름이 틀렸을 때 이 색이 대신 나옵니다) */
      background: linear-gradient(160deg, var(--배경색-위) 0%, var(--배경색-아래) 100%);
      background-attachment: fixed;

      display: flex;
      justify-content: center; /* 큰 화면(컴퓨터)에서도 가운데에 오게 */
      overflow-x: hidden;      /* 옆으로 밀리지 않게 */
    }

    /* ================================================================
       [ 2-2 ] 배경 사진 (바다 사진)

       👇 [바꾸는 곳 2-3] 배경 사진을 바꾸고 싶을 때

       ★ 가장 쉬운 방법 (코드를 안 건드려도 됩니다)
         새로 쓸 사진의 이름을 '배경사진.png' 로 바꿔서
         '샘플 사진' 폴더 안에 덮어쓰기만 하세요. 끝입니다!

       ★ 파일 이름을 그대로 두고 싶다면
         아래 url( ... ) 안의 이름을 새 사진 이름으로 바꾸세요
         '샘플 사진/' 은 폴더 이름, 그 뒤가 사진 파일 이름입니다
         ※ 파일 이름을 한 글자라도 틀리면 사진이 안 나옵니다
       ================================================================ */
    .배경사진 {
      position: fixed;   /* 화면에 고정 — 손가락으로 내려도 사진은 그대로 */
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -1;       /* 모든 내용보다 맨 뒤에 깔립니다 */

      background-image: url('샘플 사진/배경사진.png');
      background-size: cover;      /* 화면을 꽉 채우게 (잘려도 빈틈 없이) */
      background-position: center; /* 사진의 가운데를 보여줍니다 */
      background-repeat: no-repeat;
    }

    /* 사진 위에 덮는 갈색 막 — 이게 있어야 크림색 글씨가 잘 보입니다 */
    .배경사진::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(160deg, var(--사진막-위) 0%, var(--사진막-아래) 100%);
    }

    /* ================================================================
       [ 3 ] 배경에 떠 있는 흐릿한 빛 방울
       유리 카드가 예쁘게 비쳐 보이도록 뒤에 깔아두는 장식입니다
       ================================================================ */
    .빛방울 {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);   /* 뿌옇게 번지는 효과 */
      /* 배경 사진이 생겼으므로 빛 방울은 은은하게만 남겨둡니다
         (완전히 없애고 싶으면 아래 숫자를 0 으로 바꾸세요) */
      opacity: 0.22;
      z-index: 0;           /* 항상 카드보다 뒤에 있게 */
      pointer-events: none; /* 손가락 터치를 방해하지 않게 */
    }
    /* 빛 방울 색깔도 따뜻한 갈색·크림 계열로 맞췄습니다 */
    .빛방울.하나 { width: 280px; height: 280px; background: #d8b183; top: -70px;  left: -90px; }
    .빛방울.둘   { width: 320px; height: 320px; background: #8a5a33; top: 45%;    right: -130px; }
    .빛방울.셋   { width: 260px; height: 260px; background: #c99a63; bottom: -70px; left: -70px; }

    /* ================================================================
       [ 4 ] 전체 틀 — 휴대폰 가로 폭 390px 기준
       ================================================================ */
    .메뉴판 {
      position: relative;
      z-index: 1;              /* 빛방울보다 앞에 오게 */
      width: 100%;
      max-width: 390px;        /* 휴대폰 기준 폭 */
      /* 답답해 보이지 않게 위아래·좌우 여백을 넉넉히 줍니다 */
      padding: 44px 20px 48px;

      /* 아래쪽은 아이폰 홈 버튼 줄에 가려지지 않도록 여유를 둡니다 */
      padding-bottom: calc(48px + env(safe-area-inset-bottom));

      /* 휴대폰을 가로로 돌렸을 때 카메라 구멍(노치)에
         글자가 가려지지 않도록 좌우에도 여유를 둡니다 */
      padding-left: calc(20px + env(safe-area-inset-left));
      padding-right: calc(20px + env(safe-area-inset-right));
    }

    /* ================================================================
       [ 5 ] 맨 위 — 가게 이름과 한 줄 소개
       ================================================================ */
    .머리 {
      text-align: center;
      margin-bottom: 38px;
    }

    .가게이름 {

      font-weight: normal;
      letter-spacing: 3px;

      word-break: keep-all;      /* 가게 이름이 길어도 낱말 단위로 줄바꿈 */
      overflow-wrap: anywhere;

      word-break: keep-all;

    /* 가게 이름 아래 짧은 장식선 */
    .장식선 {
      width: 48px;

      background: var(--포인트색);
      opacity: 0.6;
      border-radius: 2px;
    }

    /* ================================================================
       [ 5-2 ] 카테고리 버튼 줄 (전체 / 커피 / 논커피 / 디저트)

       ※ 버튼은 파일 맨 위 메뉴 목록을 보고 자동으로 만들어집니다.
         새 분류를 추가하시면 버튼도 저절로 하나 늘어납니다.
       ================================================================ */
    .분류버튼줄 {
      /* 화면을 아래로 내려도 버튼 줄은 위에 붙어서 따라옵니다 */
      position: sticky;
      top: 10px;
      z-index: 5;

      display: flex;
      gap: 6px;
      margin-bottom: 30px;
      padding: 8px;

      /* 메뉴 카드와 똑같은 유리 느낌 */
      background: rgba(251, 243, 230, 0.13);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(251, 243, 230, 0.20);
      border-radius: 22px;
      /* 그림자를 두 겹으로 겹쳐서 더 부드럽게 퍼지게 만듭니다 */
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14),
                  0 14px 34px rgba(0, 0, 0, 0.22);

      /* 분류를 많이 만드셔도 옆으로 밀어서 볼 수 있게 */
      overflow-x: auto;
      scrollbar-width: none;      /* 스크롤 막대는 숨깁니다 */
    }
    .분류버튼줄::-webkit-scrollbar { display: none; }

    /* 버튼 하나하나 — 손가락으로 누르기 편한 크기입니다 */
    .분류버튼 {
      flex: 1 0 auto;        /* 버튼이 적으면 넓게 퍼져서 꽉 채웁니다 */
      min-height: 50px;      /* 👇 [바꾸는 곳 4-2] 버튼 높이 (숫자를 키우면 더 커집니다) */
      padding: 0 16px;

      border: none;
      border-radius: 15px;
      background: transparent;          /* 안 눌린 버튼은 투명 */
      color: rgba(251, 243, 230, 0.80);

      font-family: inherit;  /* 위에서 정한 글꼴 그대로 사용 */
      font-size: 16px;
      letter-spacing: 0.5px;
      white-space: nowrap;   /* 글자가 두 줄로 쪼개지지 않게 */
      cursor: pointer;

      transition: background 0.18s ease, color 0.18s ease;
    }

    /* 지금 선택된 버튼 — 크림색으로 확실하게 표시됩니다 */
    .분류버튼.선택됨 {
      background: var(--포인트색);
      color: var(--진한갈색);  /* 밝은 버튼 위라서 글자는 진한 갈색 */
      box-shadow: 0 4px 16px rgba(240, 220, 184, 0.28);
    }

    /* ================================================================
       [ 6 ] 가운데 — 메뉴 카드 (반투명 유리 느낌)
       ================================================================ */
    .메뉴목록 {
      display: flex;
      flex-direction: column;
      gap: 18px;             /* 카드 사이 간격 */
      margin-bottom: 40px;
    }

    /* 분류 제목 (커피 / 논커피 / 디저트) */
    .분류제목 {
      display: flex;
      align-items: center;
      gap: 14px;

      font-size: 16px;
      font-weight: normal;
      letter-spacing: 5px;
      color: var(--포인트색);
      margin-top: 22px;       /* 위쪽 카드와 넉넉히 거리를 둡니다 */
      margin-bottom: -2px;
      padding-left: 4px;
    }

    /* 분류 제목 오른쪽에 이어지는 얇은 선 */
    .분류제목::after {
      content: '';
      flex: 1;                /* 남는 공간을 선이 전부 채웁니다 */
      height: 1px;
      background: rgba(251, 243, 230, 0.22);
    }

    /* 첫 번째 분류 제목은 위 여백을 없앱니다 */
    .분류제목:first-child {
      margin-top: 0;
    }

    /* 메뉴 목록에 문제가 있을 때 뜨는 안내 상자
       (평소에는 화면에 나타나지 않습니다) */
    .오류안내 {
      background: rgba(255, 90, 90, 0.18);
      border: 1px solid rgba(255, 140, 140, 0.55);
      border-radius: 18px;
      padding: 20px;
      font-size: 14px;
      line-height: 1.8;
      text-align: center;
    }

    .메뉴카드 {
      /* ▼ 글래스모피즘(유리) 효과의 핵심 3가지 ▼ */
      background: rgba(251, 243, 230, 0.13);              /* 1. 반투명 크림색 */
      backdrop-filter: blur(18px);                        /* 2. 뒷배경 뿌옇게 */
      -webkit-backdrop-filter: blur(18px);                /*    (아이폰용) */
      border: 1px solid rgba(251, 243, 230, 0.20);        /* 3. 얇고 밝은 테두리 */

      border-radius: 26px;                                /* 더 둥근 모서리 */
      /* 그림자를 두 겹으로 겹쳐서 부드럽게 퍼지는 느낌을 냅니다 */
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14),
                  0 16px 36px rgba(0, 0, 0, 0.20);
      padding: 24px 22px;                                 /* 카드 안쪽 여백을 넉넉히 */

      /* 손가락으로 눌렀을 때 부드럽게 반응하도록 */
      transition: transform 0.18s ease, background 0.18s ease;
    }

    /* 손가락으로 누르는 순간 살짝 작아지는 효과 */
    .메뉴카드:active {
      transform: scale(0.975);
      background: rgba(251, 243, 230, 0.20);
    }

    /* 메뉴 이름과 가격을 한 줄에 좌우로 나란히 놓습니다 */
    .메뉴윗줄 {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 11px;
    }

    .메뉴이름 {
      font-size: 19px;
      font-weight: normal;
      letter-spacing: 0.3px;

      /* 메뉴 이름이 길어도 낱말 단위로 자연스럽게 줄바꿈됩니다
         (예: '디카페인 헤이즐넛 라떼' → 낱말 사이에서 줄이 바뀜) */
      word-break: keep-all;
      overflow-wrap: anywhere;  /* 그래도 넘칠 만큼 길면 글자 사이에서 자릅니다 */
      min-width: 0;             /* 좁은 화면에서 줄바꿈이 되도록 허용 */
    }

    /* 가격 — 눈에 잘 띄도록 조금 크고 진하게 */
    .메뉴가격 {
      font-size: 20px;      /* 👇 [바꾸는 곳 4-4] 가격 글자 크기 */
      font-weight: 700;     /* 진하게 (숫자가 클수록 진합니다) */
      color: var(--포인트색);
      letter-spacing: 0.5px;
      white-space: nowrap;  /* 가격이 두 줄로 쪼개지지 않게 */
      flex-shrink: 0;       /* 이름이 길어도 가격은 절대 찌그러지지 않게 */
    }

    .메뉴설명 {
      font-size: 14px;
      color: var(--흐린글자색);
      line-height: 1.75;    /* 줄 사이를 띄워 읽기 편하게 */
    }

    /* ================================================================
       [ 6-2 ] 배지 (사장님 추천 / 오늘 품절)

       ※ 배지는 메뉴 목록에서 추천: 1  또는  품절: 1  로
         바꾼 메뉴에만 자동으로 붙습니다.
       ================================================================ */

    /* 배지들이 놓이는 줄 (메뉴 이름 바로 위) */
    .배지줄 {
      display: flex;
      flex-wrap: wrap;   /* 배지가 많으면 다음 줄로 넘어갑니다 */
      gap: 6px;
      margin-bottom: 12px;
    }

    /* 배지 공통 모양 — 작고 둥근 알약 모양 */
    .배지 {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;   /* 숫자를 크게 주면 완전한 알약 모양이 됩니다 */
      font-size: 12px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* '사장님 추천' 배지 — 크림색으로 눈에 띄게 */
    .배지.추천 {
      background: var(--포인트색);
      color: var(--진한갈색);
      box-shadow: 0 3px 10px rgba(240, 220, 184, 0.24);
    }

    /* '오늘 품절' 배지 — 테두리만 있는 차분한 모양 */
    .배지.품절 {
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(251, 243, 230, 0.45);
      color: var(--글자색);
    }

    /* ▼ 추천 메뉴 카드 — 보통 카드보다 살짝 더 밝고 또렷하게 ▼ */
    .메뉴카드.추천카드 {
      background: rgba(251, 243, 230, 0.19);          /* 조금 더 밝게 */
      border: 1px solid rgba(240, 220, 184, 0.55);    /* 크림색 테두리를 또렷하게 */
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.16),
                  0 16px 40px rgba(0, 0, 0, 0.24),
                  0 0 0 1px rgba(240, 220, 184, 0.12); /* 은은한 테두리 빛 */
    }

    /* ▼ 품절 메뉴 카드 — 흐리게 보이게 ▼ */
    .메뉴카드.품절카드 {
      /* 👇 [바꾸는 곳 4-6] 품절 메뉴가 얼마나 흐려질지
         숫자가 작을수록 더 흐려집니다 (0 = 안 보임 / 1 = 그대로) */
      opacity: 0.45;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);  /* 그림자도 약하게 */
    }

    /* 품절 메뉴는 이름과 가격에 취소선을 그어 확실히 알려줍니다 */
    .메뉴카드.품절카드 .메뉴이름,
    .메뉴카드.품절카드 .메뉴가격 {
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }

    /* 품절 메뉴는 눌러도 반응하지 않게 (주문할 수 없으니까요) */
    .메뉴카드.품절카드:active {
      transform: none;
      background: rgba(251, 243, 230, 0.13);
    }

    /* ================================================================
       [ 7 ] 맨 아래 — 영업시간과 전화 걸기 버튼
       ================================================================ */
    .가게정보 {
      /* 메뉴 카드와 똑같은 유리 느낌 */
      background: rgba(251, 243, 230, 0.11);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(251, 243, 230, 0.18);
      border-radius: 26px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14),
                  0 16px 36px rgba(0, 0, 0, 0.20);
      padding: 28px 22px;
      text-align: center;
    }

    .영업시간제목 {
      font-size: 13px;
      color: var(--흐린글자색);
      letter-spacing: 4px;
      margin-bottom: 14px;
    }

    .영업시간 {
      font-size: 16px;
      line-height: 2;        /* 줄 사이를 넉넉히 */
      margin-bottom: 26px;
    }

    /* 전화 걸기 버튼 — 손가락으로 누르기 좋게 크게 만들었습니다 */
    .전화버튼 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      width: 100%;
      min-height: 62px;      /* 👇 [바꾸는 곳 5-2] 전화 버튼 높이 */
      padding: 12px 16px;    /* 전화번호가 길어도 글자가 가장자리에 닿지 않게 */
      text-align: center;
      border-radius: 20px;

      background: var(--포인트색);
      color: var(--진한갈색); /* 밝은 버튼 위라서 글자는 진한 갈색 */
      font-family: inherit;  /* 위에서 정한 글꼴 그대로 사용 */
      font-size: 18px;
      letter-spacing: 0.5px;
      text-decoration: none; /* 링크 밑줄 없애기 */

      box-shadow: 0 6px 22px rgba(240, 220, 184, 0.26);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .전화버튼:active {
      transform: scale(0.97);
      box-shadow: 0 3px 12px rgba(240, 220, 184, 0.22);
    }

    /* ================================================================
       [ 7-2 ] '맨 위로' 동그란 버튼

       메뉴가 많아 아래까지 내려갔을 때, 한 번에 위로 올라갈 수 있게
       화면 오른쪽 아래에 떠 있는 버튼입니다.
       (화면을 조금 내려야 나타납니다)
       ================================================================ */
    .맨위로버튼 {
      position: fixed;
      right: 16px;
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 20;

      width: 52px;           /* 👇 [바꾸는 곳 7-1] 버튼 크기 */
      height: 52px;
      border: 1px solid rgba(251, 243, 230, 0.28);
      border-radius: 50%;    /* 동그랗게 */

      /* 메뉴 카드와 똑같은 유리 느낌 */
      background: rgba(62, 42, 30, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.32);

      color: var(--글자색);
      font-family: inherit;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;

      /* 평소에는 숨어 있다가, 화면을 내리면 스르륵 나타납니다 */
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
    }

    /* 화면을 내렸을 때 나타나는 상태 */
    .맨위로버튼.보임 {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .맨위로버튼:active {
      transform: scale(0.92);
    }

    /* 맨 아래 작은 안내 문구 */
    .맨아래문구 {
      text-align: center;
      font-size: 12px;
      color: rgba(251, 243, 230, 0.45);
      margin-top: 28px;
      line-height: 1.9;
    }
  </style>
</head>

<body>

  <!-- 배경 사진(바다 사진)이 깔리는 자리입니다 -->
  <div class="배경사진"></div>

  <!-- 배경 장식용 빛 방울 3개 (지우셔도 화면은 잘 나옵니다) -->
  <div class="빛방울 하나"></div>
  <div class="빛방울 둘"></div>
  <div class="빛방울 셋"></div>

  <div class="메뉴판">

    <!-- ============================================================
         [ 맨 위 ] 가게 이름 / 한 줄 소개
         👇 [바꾸는 곳 3] 가게 이름과 소개글을 바꾸세요
         ============================================================ -->
    <header class="머리">
      <h1 class="가게이름">바다뷰 카페</h1>
      <p class="한줄소개">창밖으로 바다가 보이는<br>조용한 동네 카페입니다</p>
      <hr class="장식선">
    </header>

    <!-- ============================================================
         [ 카테고리 버튼 ] 전체 / 커피 / 논커피 / 디저트

         ※ 여기도 비어 있는 게 정상입니다!
           파일 맨 위 메뉴 목록의 분류를 읽어서 버튼이 자동으로 만들어집니다.
           분류를 새로 추가하시면 버튼도 저절로 하나 늘어납니다.
         ============================================================ -->
    <nav class="분류버튼줄" id="버튼이_들어갈_자리"></nav>

    <!-- ============================================================
         [ 가운데 ] 메뉴 목록이 나타나는 자리

         ※ 여기는 비어 있는 게 정상입니다!
           메뉴 글자는 이 파일 맨 위 [바꾸는 곳 4] 에 모여 있고,
           그 목록을 읽어서 여기에 자동으로 그려집니다.
           ⇒ 메뉴를 고치시려면 파일 맨 위로 올라가세요.
         ============================================================ -->
    <main class="메뉴목록" id="메뉴가_들어갈_자리"></main>

    <!-- ============================================================
         [ 맨 아래 ] 영업시간 / 전화 걸기 버튼
         👇 [바꾸는 곳 5] 영업시간과 전화번호를 바꾸세요

         ★ 전화번호는 두 군데를 똑같이 바꿔야 합니다!
           ① href="tel:0212345678"  ← 여기는 숫자만 (붙임표 - 없이)
           ② 화면에 보이는 02-1234-5678  ← 여기는 보기 좋게 붙임표 넣어도 됩니다
         ============================================================ -->
    <footer class="가게정보">
      <p class="영업시간제목">영업시간</p>
      <p class="영업시간">
        평일 10:00 – 22:00<br>
        주말 11:00 – 23:00<br>
        매주 월요일 휴무
      </p>

      <a class="전화버튼" href="tel:0212345678">
        <span>📞</span>
        <span>전화 걸기 (02-1234-5678)</span>
      </a>
    </footer>

    <!-- 👇 [바꾸는 곳 6] 맨 아래 안내 문구 (필요 없으면 이 줄을 지우세요) -->
    <p class="맨아래문구">
      주문은 카운터에서 도와드립니다<br>
      맛있게 드세요 🙂
    </p>

  </div>

  <!-- 화면 오른쪽 아래에 떠 있는 '맨 위로' 버튼입니다
       👇 [바꾸는 곳 7-2] 화살표 대신 다른 글자를 넣어도 됩니다 -->
  <button class="맨위로버튼" id="맨위로_버튼" type="button" aria-label="맨 위로 이동">↑</button>


  <!-- ============================================================
       카테고리 버튼을 만들고, 메뉴를 화면에 그려주는 부분입니다.

       ※ 여기는 고치실 필요가 없습니다. 그냥 두세요.
         파일 맨 위 [바꾸는 곳 4] 의 메뉴 목록을 읽어서
         버튼을 만들고, 고른 분류의 메뉴만 카드로 보여주는 일만 합니다.
       ============================================================ -->
  <script>
    // 버튼과 메뉴 카드가 들어갈 빈 자리를 찾습니다
    const 버튼자리 = document.getElementById('버튼이_들어갈_자리');
    const 담을자리 = document.getElementById('메뉴가_들어갈_자리');

    /* 👇 [바꾸는 곳 4-3] 손님이 처음 들어왔을 때 선택되어 있을 버튼
       지금은 '전체' 입니다.
       예를 들어 커피부터 보여주고 싶으면 '커피' 로 바꾸세요 */
    const 처음선택 = '전체';


    // ─────────────────────────────────────────────
    // 메뉴 하나를 카드 모양으로 만들어주는 일꾼
    // ─────────────────────────────────────────────
    function 카드만들기(메뉴) {
      const 카드 = document.createElement('article');
      카드.className = '메뉴카드';

      // ▼ 추천 / 품절 표시를 확인합니다 ▼
      // 메뉴 목록에서 추천: 1 이면 강조, 품절: 1 이면 흐리게 만듭니다
      if (메뉴.추천) { 카드.classList.add('추천카드'); }
      if (메뉴.품절) { 카드.classList.add('품절카드'); }

      // 배지가 하나라도 있으면 이름 위에 배지 줄을 만듭니다
      if (메뉴.추천 || 메뉴.품절) {
        const 배지줄 = document.createElement('div');
        배지줄.className = '배지줄';

        if (메뉴.품절) {
          const 품절배지 = document.createElement('span');
          품절배지.className = '배지 품절';
          품절배지.textContent = 품절배지문구;   // '오늘 품절'
          배지줄.appendChild(품절배지);
        }

        if (메뉴.추천) {
          const 추천배지 = document.createElement('span');
          추천배지.className = '배지 추천';
          추천배지.textContent = 추천배지문구;   // '사장님 추천'
          배지줄.appendChild(추천배지);
        }

        카드.appendChild(배지줄);
      }

      // 메뉴 이름과 가격이 들어가는 윗줄
      const 윗줄 = document.createElement('div');
      윗줄.className = '메뉴윗줄';

      const 이름칸 = document.createElement('span');
      이름칸.className = '메뉴이름';
      이름칸.textContent = 메뉴.이름;

      const 가격칸 = document.createElement('span');
      가격칸.className = '메뉴가격';
      가격칸.textContent = 메뉴.가격;

      윗줄.appendChild(이름칸);
      윗줄.appendChild(가격칸);

      // 메뉴 설명이 들어가는 아랫줄
      const 설명칸 = document.createElement('p');
      설명칸.className = '메뉴설명';
      설명칸.textContent = 메뉴.설명;

      카드.appendChild(윗줄);
      카드.appendChild(설명칸);

      return 카드;
    }


    // ─────────────────────────────────────────────
    // 버튼을 눌렀을 때 실행되는 일꾼
    // 고른 분류의 메뉴만 화면에 다시 그립니다
    // ─────────────────────────────────────────────
    function 분류고르기(고른분류) {

      // ① 눌린 버튼에만 색을 입힙니다 (나머지는 색을 뺍니다)
      Array.prototype.forEach.call(버튼자리.children, function (버튼) {
        if (버튼.textContent === 고른분류) {
          버튼.classList.add('선택됨');
        } else {
          버튼.classList.remove('선택됨');
        }
      });

      // ② 화면에 있던 기존 메뉴 카드를 모두 지웁니다
      담을자리.innerHTML = '';

      // ③ 분류(커피 → 논커피 → 디저트)를 순서대로 하나씩 처리합니다
      메뉴자료.forEach(function (분류덩어리) {

        // '전체'가 아니고, 지금 고른 분류도 아니면 → 건너뜁니다
        if (고른분류 !== '전체' && 분류덩어리.분류 !== 고른분류) {
          return;
        }

        // 분류 제목을 만듭니다 (예: 커피)
        const 제목 = document.createElement('h2');
        제목.className = '분류제목';
        제목.textContent = 분류덩어리.분류;
        담을자리.appendChild(제목);

        // 그 분류에 속한 메뉴를 하나씩 카드로 만들어 붙입니다
        분류덩어리.목록.forEach(function (메뉴) {
          담을자리.appendChild(카드만들기(메뉴));
        });
      });
    }


    // ─────────────────────────────────────────────
    // 화면이 처음 열릴 때 실행되는 부분
    // ─────────────────────────────────────────────
    try {
      // ① 버튼 이름을 정합니다 → '전체' + 메뉴 목록에 있는 분류들
      //    (분류를 새로 추가하시면 버튼도 저절로 하나 늘어납니다)
      const 버튼이름들 = ['전체'];
      메뉴자료.forEach(function (분류덩어리) {
        버튼이름들.push(분류덩어리.분류);
      });

      // ② 버튼을 하나씩 만들어 화면 위쪽에 붙입니다
      버튼이름들.forEach(function (이름) {
        const 버튼 = document.createElement('button');
        버튼.className = '분류버튼';
        버튼.type = 'button';
        버튼.textContent = 이름;

        // 이 버튼을 누르면 그 분류의 메뉴만 보여줍니다
        버튼.addEventListener('click', function () {
          분류고르기(이름);

          // 아래까지 내려간 상태에서 분류를 바꾸면
          // 목록 중간이 보여 헷갈리므로, 맨 위로 올려줍니다
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        버튼자리.appendChild(버튼);
      });

      // ③ 맨 처음에는 '전체'를 선택한 상태로 보여줍니다
      분류고르기(처음선택);


      // ④ '맨 위로' 버튼을 작동시킵니다
      const 맨위로버튼 = document.getElementById('맨위로_버튼');

      // 버튼을 누르면 화면 맨 위로 부드럽게 올라갑니다
      맨위로버튼.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // 화면을 얼마나 내렸는지 지켜보다가 버튼을 보였다 숨겼다 합니다
      window.addEventListener('scroll', function () {
        const 내려온거리 = window.scrollY;
        const 남은거리 =
          document.body.scrollHeight - (window.scrollY + window.innerHeight);

        // 400px 이상 내려왔고, 맨 아래 전화 버튼 근처가 아닐 때만 보여줍니다
        // (전화 걸기 버튼을 가리지 않도록 하기 위해서입니다)
        if (내려온거리 > 400 && 남은거리 > 160) {
          맨위로버튼.classList.add('보임');
        } else {
          맨위로버튼.classList.remove('보임');
        }
      });

    } catch (오류) {
      // 메뉴 목록에 따옴표나 쉼표가 빠졌을 때,
      // 손님에게 빈 화면 대신 안내 문구를 보여줍니다
      담을자리.innerHTML =
        '<div class="오류안내">' +
        '메뉴를 불러오지 못했습니다.<br>' +
        '파일 맨 위 메뉴 목록에서<br>' +
        '작은따옴표 \' 짝이 맞는지,<br>' +
        '줄 끝에 쉼표 , 가 빠지지 않았는지<br>' +
        '확인해 주세요.' +
        '</div>';
    }
  </script>

</body>
</html>
